[package]
name = "shopping-sessions"
version = "0.3.0"
edition = "2021"
publish = false

[[bin]]
name = "shopping-sessions"
path = "src/main.rs"

# No dependencies: std only (scoped threads, a small Parquet writer, mmap via
# libc symbols), so the build needs no crate downloads.
[dependencies]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
debug = false
