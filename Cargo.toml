[package]
name = "shopping-sessions"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "shopping-sessions"
path = "src/main.rs"

[dependencies]
memchr = "2"
memmap2 = "0.9"
rayon = "1"
hashbrown = "0.15"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
parquet = { version = "53", default-features = false }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
debug = false
